<style>

html,body{

canvas{

.panel{

.menuBox{

h1{

.subtitle{

input{

button{

}

button.secondary{

#roomInfo{

<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    update,
    onValue,
    get,
    remove,
    onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    databaseURL:
        "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

    projectId:
        "YOUR_PROJECT",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


/* =========================================================
   FIREBASE INITIALIZATION
   ========================================================= */

let firebaseReady = false;
let db = null;

try{

    const app = initializeApp(firebaseConfig);

    db = getDatabase(app);

    firebaseReady = true;

    console.log("Firebase connected");

}catch(error){

    console.error("Firebase error:",error);

}


/* =========================================================
   GLOBAL GAME STATE
   ========================================================= */

let roomId = null;
let playerId = null;
let playerName = null;

let isHost = false;

let gameStarted = false;
let gamePaused = false;
let gameEnded = false;

let lastSaveTime = 0;
let lastNetworkUpdate = 0;

let remotePlayers = {};

let collectedKeys = [];

let timeLeft = 240;

let score = 0;


/* =========================================================
   DOM
   ========================================================= */

const menu =
    document.getElementById("menu");

const nameSection =
    document.getElementById("nameSection");

const roomSection =
    document.getElementById("roomSection");

const playerNameInput =
    document.getElementById("playerName");

const joinCodeInput =
    document.getElementById("joinCode");

const roomInfo =
    document.getElementById("roomInfo");

const roomCode =
    document.getElementById("roomCode");

const roomPlayers =
    document.getElementById("roomPlayers");

const timerElement =
    document.getElementById("timer");

const keysElement =
    document.getElementById("keys");

const playersElement =
    document.getElementById("players");

const messageElement =
    document.getElementById("message");

const healthFill =
    document.getElementById("healthFill");

const saveStatus =
    document.getElementById("saveStatus");

const pauseButton =
    document.getElementById("pauseButton");


/* =========================================================
   PLAYER ID
   ========================================================= */

playerId =
    localStorage.getItem("escapeSchoolPlayerId");

if(!playerId){

    playerId =
        crypto.randomUUID();

    localStorage.setItem(
        "escapeSchoolPlayerId",
        playerId
    );

}


/* =========================================================
   MENU
   ========================================================= */

function showRoomMenu(){

    playerName =
        playerNameInput.value.trim();

    if(!playerName){

        alert("Enter your player name first.");

        return;
    }

    nameSection.classList.add("hidden");

    roomSection.classList.remove("hidden");

}


function showNameMenu(){

    roomSection.classList.add("hidden");

    nameSection.classList.remove("hidden");

}


/* =========================================================
   ROOM CODE
   ========================================================= */

function generateRoomCode(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(let i=0;i<6;i++){

        result +=
            chars[
                Math.floor(
                    Math.random()*chars.length
                )
            ];

    }

    return result;

}


/* =========================================================
   CREATE ROOM
   ========================================================= */

window.createRoom = async function(){

    if(!firebaseReady){

        alert(
            "Firebase is not configured yet. Put your Firebase config in the code."
        );

        return;
    }

    const code =
        generateRoomCode();

    roomId = code;

    isHost = true;

    const roomRef =
        ref(db,"rooms/"+roomId);

    await set(roomRef,{

        host:playerId,

        started:false,

        createdAt:Date.now(),

        players:{

            [playerId]:{

                id:playerId,

                name:playerName,

                x:0,

                y:1.7,

                z:13,

                yaw:0,

                health:100,

                keys:[],

                alive:true,

                connected:true

            }

        }

    });

    roomCode.textContent =
        code;

    roomInfo.classList.remove("hidden");

    listenToRoom();

    setupDisconnect();

};


/* =========================================================
   JOIN ROOM
   ========================================================= */

window.joinRoom = async function(){

    if(!firebaseReady){

        alert("Firebase is not configured.");

        return;
    }

    const code =
        joinCodeInput.value
            .trim()
            .toUpperCase();

    if(code.length !== 6){

        alert("Enter a valid 6-character room code.");

        return;
    }

    const roomRef =
        ref(db,"rooms/"+code);

    const snapshot =
        await get(roomRef);

    if(!snapshot.exists()){

        alert("Room does not exist.");

        return;
    }

    const room =
        snapshot.val();

    if(room.started){

        alert("This game has already started.");

        return;
    }

    const players =
        room.players || {};

    if(Object.keys(players).length >= 5){

        alert("Room is full.");

        return;
    }

    roomId = code;

    isHost = false;

    await set(
        ref(
            db,
            "rooms/"+roomId+
            "/players/"+playerId
        ),
        {

            id:playerId,

            name:playerName,

            x:0,

            y:1.7,

            z:13,

            yaw:0,

            health:100,

            keys:[],

            alive:true,

            connected:true

        }
    );

    roomCode.textContent =
        code;

    roomInfo.classList.remove("hidden");

    listenToRoom();

    setupDisconnect();

};


/* =========================================================
   DISCONNECT HANDLER
   ========================================================= */

function setupDisconnect(){

    if(!firebaseReady || !roomId)
        return;

    const playerRef =
        ref(
            db,
            "rooms/"+roomId+
            "/players/"+playerId+
            "/connected"
        );

    onDisconnect(playerRef)
        .set(false);

}


/* =========================================================
   ROOM LISTENER
   ========================================================= */

function listenToRoom(){

    const roomRef =
        ref(db,"rooms/"+roomId);

    onValue(roomRef,(snapshot)=>{

        if(!snapshot.exists())
            return;

        const room =
            snapshot.val();

        const players =
            room.players || {};

        const count =
            Object.keys(players).length;

        roomPlayers.innerHTML =
            Object.values(players)
            .map(
                p =>
                `${p.name || "Player"} ${p.connected === false ? "🔴" : "🟢"}`
            )
            .join("<br>");

        playersElement.innerHTML =
            Object.values(players)
            .map(
                p =>
                `${p.name || "Player"} — ${p.keys ? p.keys.length : 0}/3`
            )
            .join("<br>");

        remotePlayers =
            players;

        if(room.started && !gameStarted){

            beginGame();

        }

    });

}


/* =========================================================
   START ROOM
   ========================================================= */

window.startRoom = async function(){

    if(!isHost){

        alert("Only the host can start the game.");

        return;
    }

    const snapshot =
        await get(
            ref(
                db,
                "rooms/"+roomId+"/players"
            )
        );

    const players =
        snapshot.exists()
            ? snapshot.val()
            : {};

    const count =
        Object.keys(players).length;

    if(count < 2){

        alert("You need at least 2 players.");

        return;
    }

    await update(
        ref(db,"rooms/"+roomId),
        {

            started:true,

            startedAt:Date.now(),

            timeLeft:240

        }
    );

};


/* =========================================================
   GAME
   ========================================================= */

function beginGame(){

    if(gameStarted)
        return;

    gameStarted = true;

    menu.classList.add("hidden");

    pauseButton.style.display =
        "block";

    showMessage(
        "ESCAPE THE SCHOOL! Find all 3 keycards."
    );

    loadSavedGame();

    requestAnimationFrame(
        animate
    );

}


/* =========================================================
   THREE.JS
   ========================================================= */

let scene;
let camera;
let renderer;

let clock;

let player;

let playerHealth = 100;

let keysDown = {};

let yaw = 0;

let pitch = 0;

let objects = [];

let keyObjects = [];

let remoteMeshes = {};

let enemy;

let terminal;

let exitDoor;


/* =========================================================
   INIT
   ========================================================= */

function init3D(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x080b12);

    scene.fog =
        new THREE.Fog(
            0x080b12,
            10,
            70
        );


    camera =
        new THREE.PerspectiveCamera(
            75,
            innerWidth/innerHeight,
            .1,
            100
        );


    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );


    clock =
        new THREE.Clock();


    createLights();

    createSchool();

    createPlayer();

    createKeys();

    createEnemy();

    createTerminal();

    createExit();

    setupMouse();

}


init3D();


/* =========================================================
   LIGHTING
   ========================================================= */

function createLights(){

    const ambient =
        new THREE.HemisphereLight(
            0x8899bb,
            0x222222,
            1
        );

    scene.add(ambient);


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

    light.position.set(
        10,
        20,
        10
    );

    light.castShadow = true;

    scene.add(light);

}


/* =========================================================
   MATERIAL
   ========================================================= */

function mat(color){

    return new THREE.MeshStandardMaterial({
        color
    });

}


/* =========================================================
   BOX
   ========================================================= */

function box(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color,
    collision=true
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),
            mat(color)
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    scene.add(mesh);

    if(collision){

        objects.push(mesh);

    }

    return mesh;

}


/* =========================================================
   SCHOOL
   ========================================================= */

function createSchool(){

    /* Floor */

    box(
        0,
        -0.5,
        0,
        45,
        1,
        55,
        0x30343b,
        false
    );


    /* Outer walls */

    box(
        -22,
        3,
        0,
        1,
        7,
        55,
        0x1c222b
    );

    box(
        22,
        3,
        0,
        1,
        7,
        55,
        0x1c222b
    );

    box(
        0,
        3,
        -27,
        45,
        7,
        1,
        0x1c222b
    );

    box(
        0,
        3,
        27,
        45,
        7,
        1,
        0x1c222b
    );


    /* Corridors */

    for(let z=-20;z<=20;z+=8){

        box(
            -10,
            2,
            z,
            1,
            4,
            5,
            0x404650
        );

        box(
            10,
            2,
            z,
            1,
            4,
            5,
            0x404650
        );

    }


    /* Desks */

    for(let z=-18;z<=18;z+=6){

        for(let x=-6;x<=6;x+=4){

            box(
                x,
                .7,
                z,
                2.2,
                1.2,
                1.2,
                0x795548
            );

        }

    }


    /* Lockers */

    for(let z=-22;z<=22;z+=3){

        box(
            -19,
            2,
            z,
            1.5,
            4,
            2.2,
            0x38516e
        );

        box(
            19,
            2,
            z,
            1.5,
            4,
            2.2,
            0x38516e
        );

    }

}


/* =========================================================
   PLAYER
   ========================================================= */

function createPlayer(){

    player = {

        x:0,

        y:1.7,

        z:13,

        speed:6,

        sprintSpeed:10,

        yaw:0

    };

    camera.position.set(
        player.x,
        player.y,
        player.z
    );

}


/* =========================================================
   KEYCARDS
   ========================================================= */

function createKeys(){

    const positions = [

        [-15,1,-15],

        [14,1,3],

        [-12,1,18]

    ];

    positions.forEach(
        (p,index)=>{

            const key =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        .8,
                        .12,
                        .45
                    ),

                    new THREE.MeshStandardMaterial({
                        color:0xffd21f,
                        emissive:0x664400
                    })

                );

            key.position.set(
                p[0],
                p[1],
                p[2]
            );

            key.rotation.y =
                Math.PI/4;

            scene.add(key);

            keyObjects.push({

                mesh:key,

                id:index

            });

        }
    );

}


/* =========================================================
   ENEMY
   ========================================================= */

function createEnemy(){

    enemy =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1,
                2,
                1
            ),

            mat(0xaa2222)

        );

    enemy.position.set(
        0,
        1,
        -15
    );

    scene.add(enemy);

}


/* =========================================================
   TERMINAL
   ========================================================= */

function createTerminal(){

    terminal =
        box(
            0,
            1.5,
            -23,
            2,
            3,
            1,
            0x222222
        );

}


/* =========================================================
   EXIT
   ========================================================= */

function createExit(){

    exitDoor =
        box(
            0,
            2.5,
            25.5,
            5,
            5,
            1,
            0x993333
        );

}


/* =========================================================
   MOUSE
   ========================================================= */

function setupMouse(){

    renderer.domElement.addEventListener(
        "click",
        ()=>{
            renderer.domElement.requestPointerLock();
        }
    );


    document.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement !==
                renderer.domElement
            )
                return;

            yaw -= e.movementX*.002;

            pitch -= e.movementY*.002;

            pitch =
                Math.max(
                    -1.4,
                    Math.min(
                        1.4,
                        pitch
                    )
                );

        }
    );

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        keysDown[e.code] = true;

        if(
            e.code === "KeyW" ||
            e.code === "KeyA" ||
            e.code === "KeyS" ||
            e.code === "KeyD" ||
            e.code.startsWith("Arrow")
        ){

            e.preventDefault();

        }

        if(e.code === "KeyE"){

            interact();

        }

        if(e.code === "Escape"){

            togglePause();

        }

    }
);


document.addEventListener(
    "keyup",
    e=>{

        keysDown[e.code] = false;

    }
);


window.addEventListener(
    "blur",
    ()=>{

        keysDown = {};

    }
);


/* =========================================================
   MOBILE
   ========================================================= */

document.querySelectorAll(
    ".mobileButton"
).forEach(button=>{

    const key =
        button.dataset.key;

    button.addEventListener(
        "touchstart",
        e=>{

            e.preventDefault();

            keysDown[key] = true;

        }
    );

    button.addEventListener(
        "touchend",
        e=>{

            e.preventDefault();

            keysDown[key] = false;

        }
    );

});


/* =========================================================
   MOVEMENT
   ========================================================= */

function updatePlayer(delta){

    if(
        !gameStarted ||
        gamePaused ||
        gameEnded
    )
        return;


    let forward = 0;

    let strafe = 0;


    if(
        keysDown.KeyW ||
        keysDown.ArrowUp
    ){

        forward += 1;

    }


    if(
        keysDown.KeyS ||
        keysDown.ArrowDown
    ){

        forward -= 1;

    }


    if(
        keysDown.KeyD ||
        keysDown.ArrowRight
    ){

        strafe += 1;

    }


    if(
        keysDown.KeyA ||
        keysDown.ArrowLeft
    ){

        strafe -= 1;

    }


    if(
        forward === 0 &&
        strafe === 0
    )
        return;


    const magnitude =
        Math.sqrt(
            forward*forward +
            strafe*strafe
        );


    forward /= magnitude;

    strafe /= magnitude;


    let speed =
        keysDown.ShiftLeft ||
        keysDown.ShiftRight
            ? player.sprintSpeed
            : player.speed;


    const distance =
        speed*delta;


    const forwardX =
        Math.sin(yaw);

    const forwardZ =
        Math.cos(yaw);


    const rightX =
        Math.cos(yaw);

    const rightZ =
        -Math.sin(yaw);


    const moveX =
        forwardX*forward*distance +
        rightX*strafe*distance;


    const moveZ =
        forwardZ*forward*distance +
        rightZ*strafe*distance;


    movePlayer(
        moveX,
        moveZ
    );

}


/* =========================================================
   COLLISION
   ========================================================= */

function movePlayer(dx,dz){

    const oldX =
        player.x;

    const oldZ =
        player.z;


    player.x += dx;

    if(checkCollision()){

        player.x =
            oldX;

    }


    player.z += dz;

    if(checkCollision()){

        player.z =
            oldZ;

    }


    camera.position.set(
        player.x,
        player.y,
        player.z
    );

}


function checkCollision(){

    const radius =
        .45;


    for(
        const obj of objects
    ){

        const box =
            new THREE.Box3()
                .setFromObject(obj);


        if(
            player.x + radius > box.min.x &&
            player.x - radius < box.max.x &&
            player.z + radius > box.min.z &&
            player.z - radius < box.max.z
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   LOOK
   ========================================================= */

function updateCamera(){

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        -yaw;

    camera.rotation.x =
        pitch;

}


/* =========================================================
   KEY COLLECTION
   ========================================================= */

function checkKeys(){

    keyObjects.forEach(
        item=>{

            if(
                collectedKeys.includes(
                    item.id
                )
            )
                return;


            const dx =
                player.x -
                item.mesh.position.x;


            const dz =
                player.z -
                item.mesh.position.z;


            const distance =
                Math.sqrt(
                    dx*dx +
                    dz*dz
                );


            if(distance < 2){

                collectedKeys.push(
                    item.id
                );

                item.mesh.visible =
                    false;

                score += 100;

                updateHUD();

                showMessage(
                    `🔑 Keycard ${item.id+1} collected!`
                );

                saveGame();

            }

        }
    );

}


/* =========================================================
   INTERACTION
   ========================================================= */

function interact(){

    if(!gameStarted || gamePaused)
        return;


    const distance =
        player.z -
        terminal.position.z;


    if(
        Math.abs(distance) < 4 &&
        collectedKeys.length === 3
    ){

        const answer =
            prompt(
                "Terminal puzzle:\n\n2 + 4 × 3 = ?"
            );


        if(answer === "14"){

            showMessage(
                "🟢 Terminal unlocked!"
            );

            exitDoor.material.color.set(
                0x22aa44
            );

            exitDoor.userData.unlocked =
                true;

        }else{

            showMessage(
                "❌ Incorrect!"
            );

        }

    }

}


/* =========================================================
   EXIT
   ========================================================= */

function checkExit(){

    if(
        !exitDoor.userData.unlocked
    )
        return;


    const dx =
        player.x -
        exitDoor.position.x;


    const dz =
        player.z -
        exitDoor.position.z;


    if(
        Math.sqrt(dx*dx+dz*dz)
        < 4
    ){

        winGame();

    }

}


/* =========================================================
   ENEMY AI
   ========================================================= */

function updateEnemy(delta){

    if(
        gamePaused ||
        gameEnded
    )
        return;


    const dx =
        player.x -
        enemy.position.x;


    const dz =
        player.z -
        enemy.position.z;


    const distance =
        Math.sqrt(
            dx*dx +
            dz*dz
        );


    if(
        distance < 18
    ){

        enemy.position.x +=
            dx/distance *
            delta *
            2.5;


        enemy.position.z +=
            dz/distance *
            delta *
            2.5;

    }


    if(
        distance < 1.5
    ){

        playerHealth -=
            delta*12;

        playerHealth =
            Math.max(
                0,
                playerHealth
            );

        updateHUD();

        if(
            playerHealth <= 0
        ){

            loseGame();

        }

    }

}


/* =========================================================
   REMOTE PLAYERS
   ========================================================= */

function updateRemotePlayers(){

    if(!gameStarted)
        return;


    Object.values(
        remotePlayers
    ).forEach(
        p=>{

            if(
                p.id === playerId
            )
                return;


            if(!remoteMeshes[p.id]){

                const mesh =
                    new THREE.Mesh(

                        new THREE.CapsuleGeometry(
                            .45,
                            1.1,
                            4,
                            8
                        ),

                        mat(
                            Math.random() *
                            0xffffff
                        )

                    );

                scene.add(mesh);

                remoteMeshes[p.id] =
                    mesh;

            }


            const mesh =
                remoteMeshes[p.id];


            mesh.position.set(
                p.x || 0,
                p.y || 1.7,
                p.z || 0
            );


            mesh.rotation.y =
                p.yaw || 0;

        }
    );


    Object.keys(
        remoteMeshes
    ).forEach(id=>{

        if(
            !remotePlayers[id]
        ){

            scene.remove(
                remoteMeshes[id]
            );

            delete remoteMeshes[id];

        }

    });

}


/* =========================================================
   NETWORK UPDATE
   ========================================================= */

async function sendPlayerState(){

    if(
        !firebaseReady ||
        !roomId ||
        !gameStarted
    )
        return;


    const playerRef =
        ref(
            db,
            "rooms/"+roomId+
            "/players/"+playerId
        );


    await update(
        playerRef,
        {

            x:player.x,

            y:player.y,

            z:player.z,

            yaw:yaw,

            health:playerHealth,

            keys:collectedKeys,

            alive:playerHealth > 0,

            connected:true

        }
    );

}


/* =========================================================
   SAVE GAME
   ========================================================= */

async function saveGame(){

    const saveData = {

        playerId,

        playerName,

        roomId,

        x:player.x,

        y:player.y,

        z:player.z,

        yaw,

        health:playerHealth,

        keys:collectedKeys,

        timeLeft,

        score,

        savedAt:Date.now()

    };


    /* Local save */

    localStorage.setItem(
        "escapeSchoolSave",
        JSON.stringify(saveData)
    );


    /* Firebase save */

    if(
        firebaseReady
    ){

        try{

            await set(
                ref(
                    db,
                    "saves/"+playerId
                ),
                saveData
            );

            saveStatus.textContent =
                "☁️ Saved "+new Date()
                .toLocaleTimeString();

        }catch(error){

            console.error(
                "Save error:",
                error
            );

            saveStatus.textContent =
                "💾 Local save";

        }

    }

}


/* =========================================================
   LOAD SAVE
   ========================================================= */

async function loadSavedGame(){

    let save = null;


    /* Firebase first */

    if(
        firebaseReady
    ){

        try{

            const snapshot =
                await get(
                    ref(
                        db,
                        "saves/"+playerId
                    )
                );


            if(
                snapshot.exists()
            ){

                save =
                    snapshot.val();

            }

        }catch(error){

            console.error(error);

        }

    }


    /* Local fallback */

    if(!save){

        const local =
            localStorage.getItem(
                "escapeSchoolSave"
            );

        if(local){

            try{

                save =
                    JSON.parse(local);

            }catch(e){}

        }

    }


    if(!save)
        return;


    const useSave =
        confirm(
            "💾 A saved game was found.\n\n" +
            "Saved: "+
            new Date(
                save.savedAt
            ).toLocaleString()+
            "\n\nContinue it?"
        );


    if(!useSave)
        return;


    player.x =
        save.x ?? 0;

    player.y =
        save.y ?? 1.7;

    player.z =
        save.z ?? 13;

    yaw =
        save.yaw ?? 0;

    playerHealth =
        save.health ?? 100;

    collectedKeys =
        save.keys ?? [];

    timeLeft =
        save.timeLeft ?? 240;

    score =
        save.score ?? 0;


    keyObjects.forEach(
        item=>{

            item.mesh.visible =
                !collectedKeys.includes(
                    item.id
                );

        }
    );


    updateHUD();

    showMessage(
        "💾 Save loaded!"
    );

}


/* =========================================================
   PAUSE
   ========================================================= */

window.togglePause = function(){

    if(
        !gameStarted ||
        gameEnded
    )
        return;


    gamePaused =
        !gamePaused;


    pauseButton.textContent =
        gamePaused
            ? "▶️ Resume"
            : "⏸️ Pause";


    if(gamePaused){

        saveGame();

        showMessage(
            "⏸️ Game paused — progress saved."
        );

    }else{

        showMessage(
            "▶️ Game resumed!"
        );

    }

};


/* =========================================================
   TIMER
   ========================================================= */

let timerAccumulator = 0;

function updateTimer(delta){

    if(
        gamePaused ||
        gameEnded
    )
        return;


    timerAccumulator += delta;


    if(
        timerAccumulator >= 1
    ){

        timerAccumulator = 0;

        timeLeft--;

        timeLeft =
            Math.max(
                0,
                timeLeft
            );

        updateHUD();


        if(
            timeLeft <= 0
        ){

            loseGame();

        }

    }

}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

    healthFill.style.width =
        playerHealth+"%";


    keysElement.textContent =
        `${collectedKeys.length} / 3`;


    const minutes =
        Math.floor(
            timeLeft/60
        );

    const seconds =
        timeLeft%60;


    timerElement.textContent =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}


/* =========================================================
   MESSAGE
   ========================================================= */

let messageTimeout;

function showMessage(text){

    messageElement.textContent =
        text;

    messageElement.style.opacity =
        "1";


    clearTimeout(
        messageTimeout
    );


    messageTimeout =
        setTimeout(
            ()=>{
                messageElement.style.opacity =
                    "0";
            },
            2500
        );

}


/* =========================================================
   WIN
   ========================================================= */

async function winGame(){

    if(gameEnded)
        return;


    gameEnded = true;

    score +=
        Math.max(
            0,
            timeLeft*10
        );


    await saveGame();


    if(
        firebaseReady &&
        roomId
    ){

        await update(
            ref(
                db,
                "rooms/"+roomId+
                "/players/"+playerId
            ),
            {

                finished:true,

                finishTime:
                    Date.now(),

                score

            }
        );

    }


    document
        .getElementById(
            "gameOver"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "gameOverTitle"
        )
        .textContent =
            "🏆 YOU ESCAPED!";


    document
        .getElementById(
            "gameOverText"
        )
        .textContent =
            `Score: ${score} — You escaped the school!`;

}


/* =========================================================
   LOSE
   ========================================================= */

async function loseGame(){

    if(gameEnded)
        return;


    gameEnded = true;

    await saveGame();


    document
        .getElementById(
            "gameOver"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "gameOverTitle"
        )
        .textContent =
            "💀 GAME OVER";


    document
        .getElementById(
            "gameOverText"
        )
        .textContent =
            "You didn't escape in time!";

}


/* =========================================================
   AUTO SAVE
   ========================================================= */

async function automaticSave(){

    if(
        !gameStarted ||
        gameEnded
    )
        return;


    const now =
        Date.now();


    if(
        now-lastSaveTime <
        10000
    )
        return;


    lastSaveTime =
        now;


    await saveGame();

}


/* =========================================================
   ANIMATION
   ========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(delta);

    updateCamera();

    checkKeys();

    checkExit();

    updateEnemy(delta);

    updateRemotePlayers();

    updateTimer(delta);

    automaticSave();


    renderer.render(
        scene,
        camera
    );

}


</script>

<script>

/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        if(!camera || !renderer)
            return;


        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   GLOBAL ERROR HANDLER
   ========================================================= */

window.addEventListener(
    "error",
    e=>{

        console.error(
            "Game error:",
            e.error
        );

    }
);

</script>
